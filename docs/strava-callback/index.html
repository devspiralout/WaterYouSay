<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting to WaterYouSay...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #4A90D9 0%, #0A84FF 100%);
      color: white;
      text-align: center;
    }
    .container {
      padding: 40px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 16px;
    }
    p {
      font-size: 16px;
      opacity: 0.9;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Connecting Strava...</h1>
    <p>Redirecting you back to the app</p>
  </div>

  <script>
    // Get the query string from Strava (contains code or error)
    const queryString = window.location.search;

    // Redirect to the app's custom URL scheme
    const appUrl = 'wateryousay://' + queryString;

    // Attempt redirect
    window.location.href = appUrl;

    // Fallback message if redirect doesn't work after 2 seconds
    setTimeout(function() {
      document.querySelector('h1').textContent = 'Redirect failed';
      document.querySelector('p').textContent = 'Please open the WaterYouSay app manually';
      document.querySelector('.spinner').style.display = 'none';
    }, 2000);
  </script>
</body>
</html>
